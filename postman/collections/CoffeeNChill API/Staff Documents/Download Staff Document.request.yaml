$kind: http-request
order: 3000
url: '{{baseUrl}}/api/documents/download/{{uploadedFileName}}'
method: GET
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Ensure uploadedFileName is set before attempting download
      if (!pm.environment.get("uploadedFileName")) {
          pm.environment.set("uploadedFileName", "placeholder.pdf");
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
